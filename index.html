<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Blend Investor Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app shell. Charcoal side rail (project identity + navigation + who is viewing), quiet content area.
   The one bold element: an architect's front elevation of The Blend that fills in, part by part, as each phase is funded. */
:root{
  --ground:#F3F2EE; --surface:#FFFFFF; --sunk:#EDEBE6; --ink:#262420; --muted:#69645C; --line:#E0DCD4;
  --rail:#262420; --rail-ink:#F2EEE7; --rail-muted:#A9A294; --rail-line:#3A3732;
  --oak:#B48B58; --bronze:#8A5829; --on-bronze:#FFFFFF; --plan:#BDB6AA;
  --good:#3E7350; --good-bg:#E4EEE6; --warn:#9A6A12; --warn-bg:#F6ECD8; --bad:#A23F2E; --bad-bg:#F5E2DD;
  --shadow:0 1px 2px rgba(38,36,32,.06),0 8px 24px rgba(38,36,32,.06);
  --f-display:"Gloock", Georgia, "Times New Roman", serif;
  --f-body:"Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#181715; --surface:#211F1C; --sunk:#1C1B18; --ink:#EEEAE3; --muted:#A49C90; --line:#35322D;
  --rail:#121110; --rail-ink:#EEEAE3; --rail-muted:#8F887D; --rail-line:#2A2825;
  --oak:#C9A272; --bronze:#D59A5D; --on-bronze:#181715; --plan:#5B564F;
  --good:#7EBB8F; --good-bg:#1F3026; --warn:#DAA953; --warn-bg:#352B19; --bad:#E3866F; --bad-bg:#3A2420;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#181715; --surface:#211F1C; --sunk:#1C1B18; --ink:#EEEAE3; --muted:#A49C90; --line:#35322D;
  --rail:#121110; --rail-ink:#EEEAE3; --rail-muted:#8F887D; --rail-line:#2A2825;
  --oak:#C9A272; --bronze:#D59A5D; --on-bronze:#181715; --plan:#5B564F;
  --good:#7EBB8F; --good-bg:#1F3026; --warn:#DAA953; --warn-bg:#352B19; --bad:#E3866F; --bad-bg:#3A2420;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--ground)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:13px;color:var(--muted)}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%;background:linear-gradient(to right,var(--rail) 248px,transparent 248px)}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:26px 18px 18px max(18px,env(safe-area-inset-left,0px))}
.rail .mark{display:flex;flex-direction:column;gap:4px;padding:0 6px}
.rail .mark svg{width:46px;height:22px;margin-bottom:6px}
.rail .mark svg path{fill:none;stroke:var(--oak);stroke-width:1.6}
.rail .mark h1{font-size:30px;line-height:1}
.rail .mark span{font-size:12.5px;color:var(--rail-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:7px;color:var(--rail-muted);text-decoration:none;font-size:14.5px}
.nav a svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{color:var(--rail-ink);background:var(--rail-line)}
.nav a[aria-current="page"]{color:var(--rail-ink);background:var(--rail-line)}
.nav a[aria-current="page"] svg{stroke:var(--oak)}
.nav .ct{margin-left:auto;min-width:20px;text-align:center;font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:10px;background:var(--oak);color:var(--rail)}
.rail .who{margin-top:auto;border-top:1px solid var(--rail-line);padding:14px 6px 0;display:flex;flex-direction:column;gap:10px}
.who-row{display:flex;align-items:center;gap:10px}
.who-row img{width:30px;height:30px;border-radius:50%}
.who-row b{font-weight:500;font-size:14px;display:block}
.who-row span{font-size:12.5px;color:var(--rail-muted)}
.switch{display:flex;background:var(--rail-line);border-radius:7px;padding:3px}
.switch button{flex:1;border:0;background:transparent;color:var(--rail-muted);padding:6px 8px;border-radius:5px;font-size:12.5px;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--rail);color:var(--rail-ink)}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding-block:26px 6px;padding-left:max(16px,min(4vw,40px));padding-right:max(16px,env(safe-area-inset-right,0px),min(4vw,40px))}
.topbar h2{font-size:32px;line-height:1.1}
.topbar p{margin:4px 0 0;color:var(--muted);max-width:62ch}
main{padding-block:18px 96px;padding-left:max(16px,min(4vw,40px));padding-right:max(16px,env(safe-area-inset-right,0px),min(4vw,40px));display:flex;flex-direction:column;gap:22px;max-width:1240px;width:100%}
.mobile-head{display:none}
.bottom{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);background:none}
  .rail{display:none}
  .mobile-head{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--rail);color:var(--rail-ink);padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mobile-head h1{font-size:24px}
  .mobile-head span{font-size:12px;color:var(--rail-muted)}
  .bottom{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  .bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10.5px;color:var(--muted);text-decoration:none;position:relative;min-height:44px}
  .bottom a svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .bottom a[aria-current="page"]{color:var(--bronze)}
  .bottom .ct{position:absolute;top:2px;left:calc(50% + 6px);font-size:10px;font-weight:600;background:var(--bronze);color:var(--on-bronze);border-radius:8px;padding:0 5px}
  .topbar h2{font-size:26px}
}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.raised{box-shadow:var(--shadow);border-color:transparent}
.card h3{font-size:20px;line-height:1.2}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cols{display:grid;gap:22px}
.cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols.hero{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
@media (max-width:1100px){.cols.c3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cols.c3>:last-child{grid-column:1/-1}}
@media (max-width:960px){.cols.hero,.cols.c2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.cols.c3{grid-template-columns:minmax(0,1fr)}}

/* figures */
.figs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px}
.fig{padding:16px 18px;display:flex;flex-direction:column;gap:3px;min-width:0}
.fig + .fig{border-left:1px solid var(--line)}
.fig .v{font-family:var(--f-display);font-size:28px;line-height:1.1}
.fig .s{font-size:12.5px;color:var(--muted)}
.fig.accent .v{color:var(--bronze)}
@media (max-width:900px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}.fig{border-left:0!important;border-top:1px solid var(--line)}.fig:nth-child(-n+2){border-top:0}.fig:nth-child(even){border-left:1px solid var(--line)!important}.fig:last-child{grid-column:1/-1;border-left:0!important}}

/* elevation */
.elev-card{padding:18px 18px 14px}
.elev{width:100%;height:auto;display:block;max-height:440px}
.elev .ph{--p:0;color:color-mix(in srgb,var(--bronze) calc(var(--p) * 100%),var(--plan));cursor:pointer;transition:color .3s}
.elev .ph *{stroke:currentColor;vector-effect:non-scaling-stroke}
.elev .ph.planned *{stroke-dasharray:4 3}
.elev .ph.done{color:var(--ink)}
.elev .ph.sel{color:var(--bronze)}
.elev .ph.sel *{stroke-width:2.4;stroke-dasharray:none}
.elev .ph:hover *{stroke-width:2.2}
.elev .dim{opacity:.35}
.elev text{font-family:var(--f-body);font-size:11px;fill:var(--muted);stroke:none}
.elev-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted)}
.elev-legend span{display:inline-flex;align-items:center;gap:7px}
.elev-legend i{width:22px;height:0;border-top:2px dashed var(--plan)}
.elev-legend i.b{border-top:2px solid var(--bronze)}
.elev-legend i.k{border-top:2px solid var(--ink)}

.phases{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.phase-btn{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 8px;cursor:pointer;width:100%}
.phase-btn:hover{background:var(--sunk)}
.phase-btn[aria-pressed="true"]{background:var(--sunk)}
.phase-btn .o{font-size:12px;color:var(--muted)}
.phase-btn .n{font-weight:500;font-size:14px}
.phase-btn .a{font-size:13px;color:var(--muted)}
.phase-btn .track{grid-column:2/-1;height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden}
.phase-btn .track b{position:absolute;inset:0 auto 0 0;background:var(--bronze);border-radius:2px}
.phase-btn .track em{position:absolute;inset:0 auto 0 0;background:var(--oak);opacity:.45}
.detail{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.detail h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kv div{display:flex;flex-direction:column;gap:1px}
.kv b{font-weight:500;font-size:15px}
@media (max-width:480px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:20px;background:var(--sunk);color:var(--muted);white-space:nowrap;border:0}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.good{background:var(--good-bg);color:var(--good)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.ink{background:var(--ink);color:var(--surface)}
button.badge{cursor:pointer}

/* stepper */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.steps li:last-child{padding-bottom:0}
.steps li::after{content:"";position:absolute;left:13px;top:28px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps li.done::after{background:var(--good)}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;cursor:default;position:relative;z-index:1}
button.dot{cursor:pointer}
.dot svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.steps li.done .dot{background:var(--good);border-color:var(--good);color:var(--surface)}
.steps li.progress .dot{border-color:var(--warn)}
.steps li.progress .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--warn)}
.steps .t{font-weight:500;font-size:14.5px;padding-top:3px}
.steps .d{font-size:13px;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:14px;font-weight:500;min-height:40px;text-decoration:none;white-space:nowrap}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.bronze{background:var(--bronze);border-color:var(--bronze);color:var(--on-bronze)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-size:13.5px;color:var(--muted);cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* requests */
.reqs{display:flex;flex-direction:column;gap:12px}
.req{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px}
.req .top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.req .no{font-size:13px;color:var(--muted)}
.req .ph{font-weight:500;font-size:16px}
.req .amt{font-family:var(--f-display);font-size:28px;line-height:1;text-align:right}
.req .note{font-size:14px;color:var(--muted)}
.req .trail{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted)}
.req .act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.confirm{grid-column:1/-1;background:var(--sunk);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-size:14px}
.confirm .row{display:flex;flex-wrap:wrap;gap:8px}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:780px;font-size:14px}
th{font-size:12.5px;font-weight:500;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
th:first-child{border-top-left-radius:12px}th:last-child{border-top-right-radius:12px}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{border-bottom:0;font-weight:600}
.minibar{display:inline-flex;align-items:center;gap:8px}
.minibar i{width:64px;height:5px;border-radius:3px;background:var(--line);position:relative;overflow:hidden;display:inline-block}
.minibar i b{position:absolute;inset:0 auto 0 0;background:var(--bronze)}
td input.inl{width:116px;text-align:right;background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px}
td input.inl:hover,td input.inl:focus{border-color:var(--line);background:var(--surface)}
td select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:13px}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}

/* budget split bar */
.split{display:flex;height:34px;border-radius:8px;overflow:hidden;gap:2px}
.split button{border:0;padding:0;cursor:pointer;background:color-mix(in srgb,var(--oak) calc(30% + var(--i) * 8%),var(--surface));min-width:4px}
.split button[aria-pressed="true"]{background:var(--bronze)}
.split-legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toolbar .grow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 10px;min-height:40px;flex:1;min-width:180px;max-width:320px}
.search svg{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:1.8}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;padding:8px 0}
select.pick{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}

/* forms & sheet */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;font-size:15px;color:var(--ink);width:100%;min-width:0}
.field textarea{min-height:110px;resize:vertical}
.field .hint{font-size:12.5px}
.scrim{position:fixed;inset:0;background:rgba(20,19,17,.42);z-index:50;display:flex;justify-content:flex-end}
.sheet{background:var(--surface);width:min(520px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slidein .22s ease-out}
@keyframes slidein{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line)}
.sheet header h3{font-size:24px}
.sheet .body{padding:20px 22px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.sheet footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.iconbtn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.err{color:var(--bad);font-size:13.5px;min-height:1em}
.toasts{position:fixed;z-index:60;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);animation:toast .25s ease-out}
.toast.bad{background:var(--bad);color:#fff}
@keyframes toast{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:860px){.toasts{bottom:calc(80px + env(safe-area-inset-bottom,0px))}}

/* sign-in gate */
.gate{position:fixed;inset:0;z-index:80;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--ground)}
.gate .art{position:relative;background:var(--rail);color:var(--rail-ink);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:40px}
.gate .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 35%}

/* ============ PURE MATH (tested) ============ */
function saleModel(p){
  const yrs=p.months/12;
  const net=p.price*(1-p.sellPct/100), sellCosts=p.price-net;
  const fatCash=p.carry;
  const cost=p.principal+p.galoFinal+p.carry;
  let left=net;
  const landPaid=Math.min(p.galoFinal,Math.max(0,left)); left-=landPaid;
  const invBack=Math.min(p.principal,Math.max(0,left)); left-=invBack;
  const prefDue=p.principal*p.pref/100*yrs;
  const prefPaid=Math.min(prefDue,Math.max(0,left)); left-=prefPaid;
  const fatBack=Math.min(fatCash,Math.max(0,left)); left-=fatBack;
  const pool=Math.max(0,left);
  const invShare=pool*p.split/100, fatShare=pool-invShare;
  const projectProfit=net-cost;
  const invReceives=invBack+prefPaid+invShare, invGain=invReceives-p.principal;
  const invMultiple=invReceives/p.principal, invYield=yrs>0?invGain/p.principal/yrs:0;
  const fatReceives=fatBack+fatShare, fatGain=fatReceives-fatCash;
  const invSafe=(p.principal+p.galoFinal)/(1-p.sellPct/100);
  const breakEven=cost/(1-p.sellPct/100);
  return {net,sellCosts,fatCash,cost,landPaid,invBack,prefDue,prefPaid,fatBack,pool,invShare,fatShare,projectProfit,invReceives,invGain,invMultiple,invYield,fatReceives,fatGain,invSafe,breakEven};
}

}

function totals(){
  const committed=(S.project&&S.project.loanAmount)||PLAN_DEFAULTS.principal;
  const by=st=>S.draws.filter(d=>d.status===st).reduce((a,d)=>a+(+d.amount||0),0);
  const released=by("released"), approved=by("approved"), requested=by("requested");
  const spent=S.ledger.reduce((a,e)=>a+(+e.amount||0),0);
  return {committed,released,approved,requested,pending:approved+requested,spent,balance:committed-released,unreceipted:Math.max(0,released-spent)};
}
function phaseStats(ph){
  const ds=S.draws.filter(d=>d.phaseId===ph.id);
  const released=ds.filter(d=>d.status==="released").reduce((a,d)=>a+(+d.amount||0),0);
  const pending=ds.filter(d=>d.status==="requested"||d.status==="approved").reduce((a,d)=>a+(+d.amount||0),0);
  const spent=S.ledger.filter(e=>e.phaseId===ph.id).reduce((a,e)=>a+(+e.amount||0),0);
  const budget=+ph.budget||0;
  return {released,pending,spent,budget,balance:budget-released,available:budget-released-pending,done:budget?released/budget:0,committedPct:budget?(released+pending)/budget:0};
}

  $("#gate").hidden=true; $("#shell").hidden=false;
  loadMedia(); setInterval(loadMedia,5*3600*1000);
  const sub=(path,key)=>db.collection(path).onSnapshot(snap=>{ S[key]=snap.docs.map(d=>Object.assign({id:d.id},d.data())); S.loaded[key]=true; if(key==="draws") resolveNames(); schedule(); },()=>{ S.loaded[key]=true; schedule(); });
  sub("phases","phases"); sub("gates","gates"); sub("draws","draws"); sub("ledger","ledger"); sub("updates","updates");
  db.doc("project/main").onSnapshot(s=>{ S.project=s.exists?s.data():null; schedule(); },()=>{});
  db.doc("project/boq").onSnapshot(s=>{ S.boq=s.exists?s.data():null; schedule(); },()=>{});
  db.doc("project/plan").onSnapshot(s=>{ S.plan=s.exists?s.data():null; schedule(); },()=>{});
  db.collection("docs").onSnapshot(snap=>{ S.docs=snap.docs.map(d=>Object.assign({id:d.id},d.data())); schedule(); },()=>{});
  if(S.isOwner) db.collection("vault").onSnapshot(snap=>{ S.vault=snap.docs.map(d=>Object.assign({id:d.id},d.data())); schedule(); },()=>{});
  db.doc("project/raise").onSnapshot(s=>{ S.raise=s.exists?s.data():null; schedule(); },()=>{});
  if(S.isOwner){ db.collection("pledges").onSnapshot(snap=>{ S.pledges=snap.docs.map(d=>Object.assign({id:d.id},d.data())); resolveNames(); schedule(); },()=>{}); loadMembers(); }
  else db.doc("pledges/"+email).onSnapshot(s=>{ S.myPledge=s.exists?Object.assign({id:s.id},s.data()):null; schedule(); },()=>{});
  render();
})();
async function resolveNames(){
  if(!S.user) return;
  const ids=[...new Set(S.draws.flatMap(d=>[d.decidedBy,d.requestedBy]).concat(S.pledges.map(p=>p.id)).filter(Boolean))]; if(!ids.length) return;
  const ps=await S.user.profiles(ids); let ch=false;
  for(const id of ids){ if(!S.profiles[id]||S.profiles[id].name!==ps[id].name){ S.profiles[id]=ps[id]; ch=true; } }
  if(ch) schedule();
}
</script>
